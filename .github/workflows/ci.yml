name: MindPace CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MindPace.sln

      - name: Build solution
        run: dotnet build MindPace.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test MindPace.sln --configuration Release --no-build --verbosity normal
